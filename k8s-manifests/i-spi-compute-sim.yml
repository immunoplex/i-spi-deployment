# =============================================================================
# i-spi-compute-sim.yml -- OPTIONAL second compute tier ("sim")
#
# A complete second copy of i-spi-compute (own API, Redis queue and worker)
# writing to the SAME database. Use it to keep long jobs, such as a large
# simulation, from queueing ahead of everyday fits, or to try a new worker
# release on chosen studies first.
#
# I-SPI picks the tier per project or study with the `compute_cluster` setting:
# empty or "default" -> i-spi-compute; "sim" -> this tier. To enable it:
#   1. apply this file (after i-spi-compute.yml, whose Secret it reuses);
#   2. uncomment ISPI_COMPUTE_URL__SIM and ISPI_COMPUTE_API_KEY__SIM in
#      i-spi.yml and re-apply it;
#   3. set `compute_cluster` = "sim" in I-SPI's settings for those studies.
# Further tiers follow the same pattern: rename *-sim* to *-<name>* here and
# add ISPI_COMPUTE_URL__<NAME> / ISPI_COMPUTE_API_KEY__<NAME> to I-SPI.
#
# Differs from i-spi-compute.yml only in the names (i-spi-compute-sim-*), its
# own Redis, ROOT_PATH, and the absence of a Secret and an Ingress.
# =============================================================================

# ─── Redis ───────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-sim-redis
  labels: { app: i-spi-compute-sim-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-sim-redis }
  template:
    metadata:
      labels: { app: i-spi-compute-sim-redis }
    spec:
      containers:
        - name: i-spi-compute-sim-redis
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          args: ["--requirepass", "$(REDIS_AUTH)"]
          env:
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
          ports:
            - { containerPort: 6379, name: redis, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-sim-redis
spec:
  selector: { app: i-spi-compute-sim-redis }
  ports:
    - { port: 6379, targetPort: 6379, protocol: TCP, name: redis }

# ─── API ─────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-sim-api
  labels: { app: i-spi-compute-sim-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-sim-api }
  template:
    metadata:
      labels: { app: i-spi-compute-sim-api }
    spec:
      containers:
        - name: i-spi-compute-sim-api
          image: ghcr.io/immunoplex/i-spi-compute-api:1.2.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_HOST, value: i-spi-compute-sim-redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: API_KEY } }
            - { name: ROOT_PATH, value: /i-spi-compute-sim }
          ports:
            - { containerPort: 8000, name: http, protocol: TCP }
          readinessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-sim-api
spec:
  selector: { app: i-spi-compute-sim-api }
  ports:
    - { port: 8000, targetPort: 8000, protocol: TCP, name: http }

# ─── Worker ──────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-sim-worker
  labels: { app: i-spi-compute-sim-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-sim-worker }
  template:
    metadata:
      labels: { app: i-spi-compute-sim-worker }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: i-spi-compute-sim-worker
          image: ghcr.io/immunoplex/i-spi-compute-worker:1.2.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_HOST, value: i-spi-compute-sim-redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            - { name: DB_NAME,    value: immunoplex }
            - { name: DB_HOST,    value: postgresql }
            - { name: DB_PORT,    value: "5432" }
            - { name: DB_USER,    value: postgres }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgresql, key: POSTGRES_PASSWORD } }
            - { name: DB_SSLMODE, value: require }
            - { name: PROGRESS_DIR, value: /tmp }
            - { name: WORKER_CORES, value: "2" }     # MUST equal the CPU limit below
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }
