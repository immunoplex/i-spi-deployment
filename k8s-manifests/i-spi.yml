# =============================================================================
# i-spi.yml -- I-SPI 1.1.1, the analysis front end (R Shiny)
#
# Serves https://IMMUNOPLEX_HOSTNAME/i-spi/. Users sign in through Dex
# (dex.yml). I-SPI reads and writes the `immunoplex` database (postgresql.yml,
# schema from db/) and sends every curve fit to i-spi-compute (i-spi-compute.yml),
# which is REQUIRED: I-SPI does not fit curves itself.
#
# Placeholders, replaced by the `sed` step (README-STANDALONE-ISPI.md):
#   IMMUNOPLEX_HOSTNAME, IMMUNOPLEX_OAUTH_CLIENT_ID, IMMUNOPLEX_OAUTH_SECRET.
# The database password comes from the `postgresql` Secret (postgresql.yml),
# the compute API key from the `i-spi-compute` Secret (i-spi-compute.yml).
#
# Environment: exactly the variables I-SPI 1.1.1 reads.
#   db, db_host, db_port, db_userid_x, db_pwd_x   database (TLS is required)
#   DEX_ISSUER, DEX_INTERNAL_URL, DEX_CLIENT_ID,
#   DEX_CLIENT_SECRET, APP_REDIRECT_URI           sign-in (OIDC)
#   ISPI_COMPUTE_URL, ISPI_COMPUTE_API_KEY        default compute tier
#   ISPI_COMPUTE_URL__<NAME>, ..._API_KEY__<NAME> optional further compute tiers,
#                                                 chosen per project/study by the
#                                                 `compute_cluster` setting
#   SHINY_LOG_LEVEL, SHINY_LOG_STDERR             Shiny Server logging
# =============================================================================

# ─── OAuth client secret ─────────────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: i-spi
stringData:
  DEX_CLIENT_SECRET: IMMUNOPLEX_OAUTH_SECRET

# ─── Ingress: https://IMMUNOPLEX_HOSTNAME/i-spi/ ─────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i-spi
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: addslashbyredirect@file,i-spi-stripprefix@file
    cert-manager.io/cluster-issuer: intermediate-ca1-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/i-spi"
        backend:
          service:
            name: i-spi
            port:
              number: 3838
  tls:
  - hosts:
    - IMMUNOPLEX_HOSTNAME
    secretName: cert-secret

# ─── Service ─────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi
  labels:
    app: i-spi
spec:
  type: ClusterIP
  ports:
  - port: 3838
  selector:
    app: i-spi

# ─── Deployment ──────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi
  labels:
    app: i-spi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i-spi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: i-spi
    spec:
      containers:
        - image: ghcr.io/immunoplex/i-spi:1.1.1
          imagePullPolicy: IfNotPresent
          name: i-spi
          # Sized for interactive sessions; the fitting load is on the
          # i-spi-compute worker. Raise for many simultaneous users.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          env:
            # ── Database ──────────────────────────────────────────────────────
            - name: db
              value: "immunoplex"
            - name: db_host
              value: "postgresql"
            - name: db_port
              value: "5432"
            - name: db_userid_x
              value: postgres
            - name: db_pwd_x
              valueFrom:
                secretKeyRef:
                  name: postgresql
                  key: POSTGRES_PASSWORD
            # ── Sign-in (Dex / OIDC) ──────────────────────────────────────────
            - name: DEX_ISSUER
              value: "https://IMMUNOPLEX_HOSTNAME/dex"
            # Discovery and token calls go to Dex inside the cluster, so they do
            # not depend on the public certificate being trusted by the pod.
            - name: DEX_INTERNAL_URL
              value: "http://dex:5556/dex"
            - name: DEX_CLIENT_ID
              value: IMMUNOPLEX_OAUTH_CLIENT_ID
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: i-spi
                  key: DEX_CLIENT_SECRET
            # Must be listed in this client's redirectURIs in Dex (dex.yml).
            - name: APP_REDIRECT_URI
              value: "https://IMMUNOPLEX_HOSTNAME/i-spi/"
            # ── Compute (i-spi-compute.yml) ───────────────────────────────────
            # In-cluster Service URL: no TLS or Ingress in the path. I-SPI posts
            # to <URL>/jobs with header X-API-Key.
            - name: ISPI_COMPUTE_URL
              value: "http://i-spi-compute-api:8000"
            - name: ISPI_COMPUTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: i-spi-compute
                  key: API_KEY
            # Optional second compute tier (i-spi-compute-sim.yml). Uncomment
            # both, then set the `compute_cluster` setting to "sim" for the
            # projects or studies that should use it.
            # - name: ISPI_COMPUTE_URL__SIM
            #   value: "http://i-spi-compute-sim-api:8000"
            # - name: ISPI_COMPUTE_API_KEY__SIM
            #   valueFrom:
            #     secretKeyRef:
            #       name: i-spi-compute
            #       key: API_KEY
            # ── Logging ───────────────────────────────────────────────────────
            # INFO for normal use; DEBUG to troubleshoot sign-in.
            - name: SHINY_LOG_LEVEL
              value: INFO
            - name: SHINY_LOG_STDERR
              value: "1"
          ports:
          - containerPort: 3838
            name: shiny
