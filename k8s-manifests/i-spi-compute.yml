# =============================================================================
# i-spi-compute.yml -- i-spi-compute 1.1.0, the REQUIRED fitting tier
#
#   I-SPI --POST /jobs--> API --> Redis queue --> worker (curveR) --> calib_*
#                                                                  <-- I-SPI reads
#
# - API (FastAPI): accepts and reports jobs; does not touch the database.
# - Redis: this tier's own job queue.
# - Worker: fits standard curves with curveRfreq (frequentist) and curveRbayes
#   (Bayesian, CmdStan), estimates samples, controls and standards, computes
#   precision weights (curveRweights), and writes everything to the calib_*
#   tables. Image contents: curveRcore 0.7.0, curveRfreq 0.5.2,
#   curveRbayes 0.5.2, curveRweights 0.3.0, CmdStan 2.40.0.
# The database must hold calib schema 0.7.0 (load db/ into a new database).
#
# Placeholders, replaced by the `sed` step (README-STANDALONE-ISPI.md):
#   IMMUNOPLEX_API_KEY, IMMUNOPLEX_REDIS_AUTH (both `openssl rand -hex 32`),
#   IMMUNOPLEX_HOSTNAME (only for the optional Ingress at the end).
# The API key is shared with I-SPI, which reads it from this file's Secret.
#
# Sizing: the worker does the heavy work. WORKER_CORES MUST equal the worker's
# CPU limit (it caps parallel fits and Stan chains); its memory budget is read
# from the container limit. The values below suit a small test node; a
# production worker typically runs with 16 CPUs / 16Gi. More replicas = more
# workers taking jobs from the same queue.
#
# A second, independent compute tier is in i-spi-compute-sim.yml (optional).
# =============================================================================

# ─── Secret: API key (shared with I-SPI) and Redis password ──────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: i-spi-compute
stringData:
  API_KEY: IMMUNOPLEX_API_KEY
  REDIS_AUTH: IMMUNOPLEX_REDIS_AUTH

# ─── Redis: this tier's job queue ────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-redis
  labels: { app: i-spi-compute-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-redis }
  template:
    metadata:
      labels: { app: i-spi-compute-redis }
    spec:
      containers:
        - name: i-spi-compute-redis
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          args: ["--requirepass", "$(REDIS_AUTH)"]
          env:
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
          ports:
            - { containerPort: 6379, name: redis, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-redis
spec:
  selector: { app: i-spi-compute-redis }
  ports:
    - { port: 6379, targetPort: 6379, protocol: TCP, name: redis }

# ─── API ─────────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-api
  labels: { app: i-spi-compute-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-api }
  template:
    metadata:
      labels: { app: i-spi-compute-api }
    spec:
      containers:
        - name: i-spi-compute-api
          image: ghcr.io/immunoplex/i-spi-compute-api:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_HOST, value: i-spi-compute-redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: API_KEY } }
            # Public path prefix, used in the API's own docs links. The routes
            # are /jobs and /health whether the request comes through the
            # Ingress (prefix stripped) or straight to the Service.
            - { name: ROOT_PATH, value: /i-spi-compute }
          ports:
            - { containerPort: 8000, name: http, protocol: TCP }
          readinessProbe:
            httpGet: { path: /health, port: 8000, scheme: HTTP }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi-compute-api
spec:
  selector: { app: i-spi-compute-api }
  ports:
    - { port: 8000, targetPort: 8000, protocol: TCP, name: http }

# ─── Worker ──────────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi-compute-worker
  labels: { app: i-spi-compute-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: i-spi-compute-worker }
  template:
    metadata:
      labels: { app: i-spi-compute-worker }
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64   # Stan models are compiled for amd64
      containers:
        - name: i-spi-compute-worker
          image: ghcr.io/immunoplex/i-spi-compute-worker:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_HOST, value: i-spi-compute-redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: REDIS_DB,   value: "0" }
            - name: REDIS_AUTH
              valueFrom: { secretKeyRef: { name: i-spi-compute, key: REDIS_AUTH } }
            - { name: DB_NAME,    value: immunoplex }
            - { name: DB_HOST,    value: postgresql }
            - { name: DB_PORT,    value: "5432" }
            - { name: DB_USER,    value: postgres }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgresql, key: POSTGRES_PASSWORD } }
            - { name: DB_SSLMODE, value: require }
            - { name: PROGRESS_DIR, value: /tmp }
            - { name: WORKER_CORES, value: "2" }     # MUST equal the CPU limit below
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }

# ─── Ingress (OPTIONAL): https://IMMUNOPLEX_HOSTNAME/i-spi-compute ───────────
# I-SPI reaches the API inside the cluster and does not need this. Keep it only
# to submit or monitor jobs from outside (every call needs the X-API-Key header).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i-spi-compute
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: addslashbyredirect@file,i-spi-compute-stripprefix@file
    cert-manager.io/cluster-issuer: intermediate-ca1-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/i-spi-compute"
        backend:
          service:
            name: i-spi-compute-api
            port:
              number: 8000
  tls:
  - hosts:
    - IMMUNOPLEX_HOSTNAME
    secretName: cert-secret
