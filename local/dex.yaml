# Dex for the local stack: one local account, one client (I-SPI).
# The browser reaches Dex at http://localhost:5556/dex (the issuer); I-SPI's
# server reaches it inside the Compose network at http://dex:5556/dex
# (DEX_INTERNAL_URL). Both serve the same Dex.
issuer: http://localhost:5556/dex

storage:
  type: memory            # accounts below are static; nothing to keep

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

# Sign in with this account. Password: ispi-local
# (to change it: htpasswd -bnBC 10 "" <new password> | tr -d ':\n', and put
#  the result here).
staticPasswords:
  - email: "ispi-user@example.org"
    hash: "$2a$10$DZVsCBuyD3QxHQAhAdQDjeq0JOnMGpKSBBd7tfvVSNslVBbbyvC0C"
    username: "ispi-user"
    userID: "6d3b1c2e-0000-4000-8000-000000000001"

staticClients:
  - id: i-spi-local
    name: I-SPI (local)
    secretEnv: DEX_CLIENT_SECRET          # from .env, shared with the i-spi service
    redirectURIs:
      - http://localhost:3838/
